name: PlanGuidancePhone114
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    DEVELOPMENT_TEAM: V4238R5R53
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1'
targets:
  PlanGuidancePhone114UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ../../SideSeatUITests/PlanReliabilityUITests.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sideseat.planguidanceqa
        GENERATE_INFOPLIST_FILE: true
schemes:
  PlanGuidancePhone114:
    build:
      targets:
        PlanGuidancePhone114UITests: [test]
    test:
      targets: [PlanGuidancePhone114UITests]
      environmentVariables:
        SIDESEAT_PLAN_RELIABILITY_QA_JSON: $(SIDESEAT_PLAN_RELIABILITY_QA_JSON)
