name: PlanHierarchy153
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    DEVELOPMENT_TEAM: V4238R5R53
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1'
targets:
  PlanHierarchy153UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ../../SideSeatUITests/PlanDetailHierarchyUITests.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sideseat.planhierarchyqa
        GENERATE_INFOPLIST_FILE: true
schemes:
  PlanHierarchy153:
    build:
      targets:
        PlanHierarchy153UITests: [test]
    test:
      targets: [PlanHierarchy153UITests]
      environmentVariables:
        SIDESEAT_PLAN_HIERARCHY_JSON: $(SIDESEAT_PLAN_HIERARCHY_JSON)
