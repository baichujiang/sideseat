name: PlanReliabilityPhone113
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    DEVELOPMENT_TEAM: V4238R5R53
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1'
targets:
  PlanReliabilityPhone113UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ../../SideSeatUITests/PlanReliabilityUITests.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sideseat.planreliabilityqa
        GENERATE_INFOPLIST_FILE: true
schemes:
  PlanReliabilityPhone113:
    build:
      targets:
        PlanReliabilityPhone113UITests: [test]
    test:
      targets: [PlanReliabilityPhone113UITests]
      environmentVariables:
        SIDESEAT_PLAN_RELIABILITY_QA_JSON: $(SIDESEAT_PLAN_RELIABILITY_QA_JSON)
