name: GuestPlanPhone103
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    DEVELOPMENT_TEAM: V4238R5R53
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1'
targets:
  GuestPlanPhone103UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ../../SideSeatUITests/UnifiedPlanLiveUITests.swift
      - path: ../../SideSeatUITests/AvailabilityGestureUITests.swift
      - path: ../../SideSeatUITests/PlanCreationPresentationUITests.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sideseat.guestplanqa
        GENERATE_INFOPLIST_FILE: true
schemes:
  GuestPlanPhone103:
    build:
      targets:
        GuestPlanPhone103UITests: [test]
    test:
      targets: [GuestPlanPhone103UITests]
      environmentVariables:
        SIDESEAT_UNIFIED_PLAN_QA: $(SIDESEAT_UNIFIED_PLAN_QA)
        SIDESEAT_UNIFIED_PLAN_QA_API: $(SIDESEAT_UNIFIED_PLAN_QA_API)
        SIDESEAT_UNIFIED_PLAN_QA_ACCOUNTS_JSON: $(SIDESEAT_UNIFIED_PLAN_QA_ACCOUNTS_JSON)
        SIDESEAT_UNIFIED_PLAN_QA_BUNDLE: $(SIDESEAT_UNIFIED_PLAN_QA_BUNDLE)
