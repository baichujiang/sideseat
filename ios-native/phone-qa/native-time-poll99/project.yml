name: NativeTimePollPhone99
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    DEVELOPMENT_TEAM: V4238R5R53
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1'
targets:
  NativeTimePollPhone99UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ../../SideSeatUITests/TimePollLiveUITests.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sideseat.mobile.uitests
        GENERATE_INFOPLIST_FILE: true
schemes:
  NativeTimePollPhone99:
    build:
      targets:
        NativeTimePollPhone99UITests: [test]
    test:
      targets: [NativeTimePollPhone99UITests]
      environmentVariables:
        SIDESEAT_TIME_POLL_QA: $(SIDESEAT_TIME_POLL_QA)
        SIDESEAT_TIME_POLL_QA_API: $(SIDESEAT_TIME_POLL_QA_API)
        SIDESEAT_TIME_POLL_QA_ACCOUNTS: $(SIDESEAT_TIME_POLL_QA_ACCOUNTS)
        SIDESEAT_TIME_POLL_QA_ACCOUNTS_JSON: $(SIDESEAT_TIME_POLL_QA_ACCOUNTS_JSON)
        SIDESEAT_TIME_POLL_QA_BUNDLE: app.sideseat.mobile.preview
