name: PlanOption155
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    DEVELOPMENT_TEAM: V4238R5R53
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1'
targets:
  PlanOption155UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ../../SideSeatUITests/PlanCreationPresentationUITests.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sideseat.planoptionqa
        GENERATE_INFOPLIST_FILE: true
schemes:
  PlanOption155:
    build:
      targets:
        PlanOption155UITests: [test]
    test:
      targets: [PlanOption155UITests]
