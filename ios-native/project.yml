name: SideSeat
options:
  minimumXcodeGenVersion: 2.45.4
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
configs:
  Development: debug
  Staging: release
  Production: release
configFiles:
  Development: Configuration/Development.xcconfig
  Staging: Configuration/Staging.xcconfig
  Production: Configuration/Production.xcconfig
settings:
  base:
    DEVELOPMENT_LANGUAGE: en
    LOCALIZATION_PREFERS_STRING_CATALOGS: true
    SUPPORTS_MACCATALYST: false
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
packages:
  OpenAPIRuntime:
    url: https://github.com/apple/swift-openapi-runtime
    exactVersion: 1.12.0
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    exactVersion: 9.13.0
targets:
  SideSeat:
    type: application
    platform: iOS
    sources:
      - path: SideSeat
        excludes:
          - Resources/Preview Content
    info:
      path: SideSeat/Resources/Info.plist
      properties:
        CFBundleDisplayName: SideSeat
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: app.sideseat.mobile
            CFBundleURLSchemes:
              - sideseat
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: systemBackgroundColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - remote-notification
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocationWhenInUseUsageDescription: SideSeat uses your location to share where you are in direct chats.
        NSMicrophoneUsageDescription: SideSeat uses the microphone to turn your spoken event details into calendar text.
        NSPhotoLibraryAddUsageDescription: SideSeat saves schedule images to your photo library when you choose Save to Photos.
        NSSpeechRecognitionUsageDescription: SideSeat uses speech recognition to transcribe event details for smart calendar entry.
        SideSeatAPIBaseURL: $(SIDESEAT_API_BASE_URL)
        SideSeatEnvironment: $(SIDESEAT_ENVIRONMENT)
        SideSeatCrashDSN: $(SIDESEAT_CRASH_DSN)
    settings:
      base:
        PRODUCT_NAME: SideSeat
        PRODUCT_MODULE_NAME: SideSeat
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: SideSeat/SideSeat.entitlements
    entitlements:
      path: SideSeat/SideSeat.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.developer.associated-domains:
          - applinks:$(SIDESEAT_ASSOCIATED_DOMAIN)
    dependencies:
      - package: OpenAPIRuntime
      - package: Sentry
    preBuildScripts:
      - name: Validate Production Configuration
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/scripts/validate-production-build.sh
        script: |
          /bin/sh "$SRCROOT/scripts/validate-production-build.sh"
    postBuildScripts:
      - name: Upload Production dSYMs to Sentry
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/scripts/upload-sentry-dsyms.sh
          - $(SENTRY_CLI_PATH)
          - $(DWARF_DSYM_FOLDER_PATH)/$(DWARF_DSYM_FILE_NAME)
          - $(DWARF_DSYM_FOLDER_PATH)/$(DWARF_DSYM_FILE_NAME)/Contents/Resources/DWARF/$(PRODUCT_NAME)
          - $(DWARF_DSYM_FOLDER_PATH)/$(DWARF_DSYM_FILE_NAME)/Contents/Info.plist
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Info.plist
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
        script: |
          /bin/sh "$SRCROOT/scripts/upload-sentry-dsyms.sh"
    scheme:
      gatherCoverageData: true
      testTargets:
        - SideSeatTests
        - SideSeatUITests
  SideSeatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SideSeatTests
    dependencies:
      - target: SideSeat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sideseat.mobile.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/SideSeat.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SideSeat
        BUNDLE_LOADER: $(TEST_HOST)
  SideSeatUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SideSeatUITests
    dependencies:
      - target: SideSeat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sideseat.mobile.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: SideSeat
schemes:
  SideSeat-Development:
    build:
      targets:
        SideSeat: all
        SideSeatTests: [test]
        SideSeatUITests: [test]
    run:
      config: Development
      storeKitConfiguration: Configuration/SideSeat.storekit
    test:
      config: Development
      storeKitConfiguration: Configuration/SideSeat.storekit
      gatherCoverageData: true
      environmentVariables:
        SIDESEAT_LIVE_UI_TESTS: $(SIDESEAT_LIVE_UI_TESTS)
        SIDESEAT_RUN_REAL_PHOTO_TEST: $(SIDESEAT_RUN_REAL_PHOTO_TEST)
        E2E_USER: $(E2E_USER)
        E2E_PASSWORD: $(E2E_PASSWORD)
        E2E_COURSE_ID: $(E2E_COURSE_ID)
        E2E_COURSE_NAME: $(E2E_COURSE_NAME)
      targets:
        - SideSeatTests
        - SideSeatUITests
    profile:
      config: Staging
    analyze:
      config: Development
    archive:
      config: Production
  SideSeat-Staging:
    build:
      targets:
        SideSeat: all
    run:
      config: Staging
    archive:
      config: Staging
  SideSeat-Production:
    build:
      targets:
        SideSeat: all
    run:
      config: Production
    archive:
      config: Production
