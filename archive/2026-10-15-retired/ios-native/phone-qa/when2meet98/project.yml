name: When2meetPhone98
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    DEVELOPMENT_TEAM: V4238R5R53
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1'
targets:
  When2meetPhone98UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sideseat.mobile.uitests
        GENERATE_INFOPLIST_FILE: true
schemes:
  When2meetPhone98:
    build:
      targets:
        When2meetPhone98UITests: [test]
    test:
      targets: [When2meetPhone98UITests]
      environmentVariables:
        SIDESEAT_WHEN2MEET_PHONE_QA: $(SIDESEAT_WHEN2MEET_PHONE_QA)
